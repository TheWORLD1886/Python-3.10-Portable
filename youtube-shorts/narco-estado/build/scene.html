<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- helpers ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .6, metalness: 0, ...o });

function softTex(inner = 'rgba(255,255,255,1)', outer = 'rgba(255,255,255,0)') {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); return t;
}
function textTex(lines, { w = 1024, h = 256, color = '#ffd23a', glow = '#ff9a00', size = 120, bg = null, border = null } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  if (border) { g.strokeStyle = border; g.lineWidth = 10; g.strokeRect(8, 8, w - 16, h - 16); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `900 ${size}px "Liberation Sans", Arial`;
  g.shadowColor = glow; g.shadowBlur = 30; g.fillStyle = color;
  lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.1));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function holoPlane(tex, w, h, opacity = .95) {
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
}

// ---------- evolved stickman ----------
// White matte porcelain sphere head, organic capsule limbs (no exposed joint spheres), real 3D clothing.
function stickman(outfit) {
  const skin = std(0xf3f1ec, { roughness: .45, envMapIntensity: .6 });
  const O = {
    suitBlack: { top: std(0x111114, { roughness: .55 }), legs: std(0x0d0d10, { roughness: .6 }), shoe: std(0x050505, { roughness: .25 }), shirt: true, tie: 0x0a0a0a },
    suitGrey:  { top: std(0x2c2f36, { roughness: .6 }), legs: std(0x24272d), shoe: std(0x120c08, { roughness: .3 }), shirt: true, tie: 0x7a1010 },
    suitNavy:  { top: std(0x14213d, { roughness: .55 }), legs: std(0x111a30), shoe: std(0x0a0a0a, { roughness: .3 }), shirt: true, tie: 0x8a1a1a, loose: true },
    camo:      { top: std(0x4b5532, { roughness: .9 }), legs: std(0x434b2c, { roughness: .9 }), shoe: std(0x2a2015, { roughness: .8 }), vest: 0x3a3f28, helmet: 0x4a5233 },
    tactical:  { top: std(0x161616, { roughness: .85 }), legs: std(0x121212, { roughness: .85 }), shoe: std(0x0a0a0a, { roughness: .7 }), vest: 0x1d1d1d, hood: true, gloves: true },
  }[outfit];
  const root = new THREE.Group(), rig = { root };
  // torso / jacket
  const torso = capsule(.165, .36, O.top); torso.scale.set(1, 1, .62); torso.position.y = 1.2; root.add(torso);
  const hips = capsule(.14, .08, O.legs); hips.scale.set(1.05, 1, .68); hips.position.y = .95; root.add(hips);
  const neck = capsule(.045, .07, skin); neck.position.y = 1.5; root.add(neck);
  const head = mesh(new THREE.SphereGeometry(.135, 48, 32), skin, 0, 1.66, 0, root); rig.head = head;
  if (O.shirt) {
    const shirt = mesh(new THREE.PlaneGeometry(.11, .34), std(0xf4f4f4), 0, 1.32, .108, root);
    const tie = mesh(new THREE.BoxGeometry(.04, .3, .01), std(O.tie, { roughness: .4 }), 0, O.loose ? 1.28 : 1.3, .114, root);
    if (O.loose) tie.rotation.z = .08;
    for (const s of [-1, 1]) { const lap = mesh(new THREE.BoxGeometry(.06, .3, .015), O.top, s * .07, 1.33, .1, root); lap.rotation.z = s * .28; }
  }
  if (O.vest) {
    const vest = new THREE.Mesh(new THREE.CapsuleGeometry(.18, .26, 8, 20), std(O.vest, { roughness: .9 })); vest.scale.set(1.05, 1, .78); vest.position.y = 1.2; root.add(vest);
    for (let i = -1; i <= 1; i++) mesh(new THREE.BoxGeometry(.085, .1, .05), std(O.vest - 0x050505, { roughness: .95 }), i * .1, 1.1, .14, root);
    { const belt = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .05, 24), std(0x101010)); belt.scale.z = .7; belt.position.y = 1.0; root.add(belt); }
  }
  if (O.helmet) { const h = mesh(new THREE.SphereGeometry(.15, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), std(O.helmet, { roughness: .9 }), 0, 1.68, 0, root); }
  if (O.hood) { const hood = new THREE.Mesh(new THREE.TorusGeometry(.085, .045, 12, 24), std(0x0e0e0e, { roughness: 1 })); hood.rotation.x = Math.PI / 2; hood.position.y = 1.52; root.add(hood); }

  function limb(px, py, r, l1, l2, mat, endMat, endGeo) {
    const a = new THREE.Group(); a.position.set(px, py, 0); root.add(a);
    const up = capsule(r, l1, mat); up.position.y = -l1 / 2; a.add(up);
    const b = new THREE.Group(); b.position.y = -l1; a.add(b);
    const lo = capsule(r * .9, l2, mat); lo.position.y = -l2 / 2; b.add(lo);
    const end = new THREE.Mesh(endGeo, endMat); end.castShadow = true; b.add(end);
    return { a, b, end };
  }
  const handMat = O.gloves ? std(0x0c0c0c, { roughness: .8 }) : skin;
  for (const s of [-1, 1]) {
    const arm = limb(s * .215, 1.42, .052, .27, .25, O.top, handMat, new THREE.CapsuleGeometry(.04, .06, 6, 12));
    arm.end.position.y = -.31; arm.a.rotation.z = s * .1;
    const leg = limb(s * .085, .95, .068, .4, .4, O.legs, O.shoe, new THREE.BoxGeometry(.1, .07, .24));
    leg.end.position.set(0, -.46, .05);
    rig[s < 0 ? 'lArm' : 'rArm'] = arm; rig[s < 0 ? 'lLeg' : 'rLeg'] = leg;
  }
  if (outfit === 'suitBlack') { // presidential sash: green / white / red
    const cols = [0x0b6b3a, 0xf2f2f2, 0xb3121b];
    cols.forEach((c, i) => { const b = mesh(new THREE.BoxGeometry(.06, .62, .02), std(c, { roughness: .5 }), 0, 0, 0, root);
      b.position.set(-.02 + (i - 1) * .055, 1.2, .118); b.rotation.z = .62; });
  }
  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return rig;
}

// ---------- scenes ----------
const SC = [];
function base(bg, fogNear, fogFar) {
  const s = new THREE.Scene(); s.background = new THREE.Color(bg); s.fog = new THREE.Fog(bg, fogNear, fogFar); s.environment = envTex;
  const cam = new THREE.PerspectiveCamera(35, W / H, .1, 300); return { s, cam };
}
function dirLight(s, color, int, pos, target = [0, 0, 0], size = 6) {
  const l = new THREE.DirectionalLight(color, int); l.position.set(...pos); l.target.position.set(...target); s.add(l, l.target);
  l.castShadow = true; l.shadow.mapSize.set(1024, 1024); const c = l.shadow.camera; c.left = c.bottom = -size; c.right = c.top = size; c.near = .5; c.far = 60; l.shadow.bias = -.0005; return l;
}
function particles(n, seed, color, size, spread, opacity = .9, tex = softTex()) {
  const r = rng(seed), geo = new THREE.BufferGeometry(), base = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) { base[i * 4] = (r() - .5) * spread[0]; base[i * 4 + 1] = r() * spread[1]; base[i * 4 + 2] = (r() - .5) * spread[2]; base[i * 4 + 3] = r(); }
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, map: tex, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.userData.base = base; pts.userData.spread = spread; return pts;
}
function moveParticles(pts, t, vy, wob = .2) {
  const b = pts.userData.base, sp = pts.userData.spread, p = pts.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const ph = b[i * 4 + 3] * 6.28;
    p.setXYZ(i, b[i * 4] + Math.sin(t * .7 + ph) * wob, ((b[i * 4 + 1] + t * vy) % sp[1] + sp[1]) % sp[1], b[i * 4 + 2] + Math.cos(t * .5 + ph) * wob);
  }
  p.needsUpdate = true;
}

// 1) Presidential balcony at night
SC.push((() => {
  const { s, cam } = base(0x05070d, 12, 60);
  s.add(new THREE.HemisphereLight(0x2a3550, 0x080604, .5));
  const stone = std(0x3a342c, { roughness: .85 }), gold = std(0xc9962e, { metalness: 1, roughness: .3 });
  mesh(new THREE.BoxGeometry(30, 16, 1), stone, 0, 7, -3.2, s);                     // facade
  mesh(new THREE.BoxGeometry(8, .35, 3.2), stone, 0, -.17, -.6, s);                    // balcony slab
  for (let i = -6; i <= 6; i++) { if (Math.abs(i) < 1) continue; mesh(new THREE.CylinderGeometry(.32, .38, 9, 24), std(0x4a4238, { roughness: .8 }), i * 2.1, 3.2, -2.3, s); }
  // windows (warm, glowing)
  for (let i = -5; i <= 5; i++) for (let j = 0; j < 2; j++) if (i !== 0 || j === 1) {
    mesh(new THREE.PlaneGeometry(1.1, 2), new THREE.MeshStandardMaterial({ color: 0x110900, emissive: 0xffa640, emissiveIntensity: j ? 1.2 : .9 }), i * 2.1 + 1.05, 2 + j * 4.5, -2.69, s);
  }
  // doorway behind character
  mesh(new THREE.PlaneGeometry(2.2, 3.4), new THREE.MeshStandardMaterial({ color: 0x150b00, emissive: 0xffb24d, emissiveIntensity: .7 }), 0, 1.7, -2.68, s);
  mesh(new THREE.BoxGeometry(2.6, .3, .3), gold, 0, 3.55, -2.6, s);
  // balustrade
  mesh(new THREE.BoxGeometry(7, .14, .4), stone, 0, 1.05, .85, s);
  mesh(new THREE.BoxGeometry(7, .12, .4), stone, 0, .06, .85, s);
  for (let i = -16; i <= 16; i++) mesh(new THREE.CylinderGeometry(.07, .1, .9, 12), std(0x5a5146, { roughness: .8 }), i * .21, .55, .85, s);
  // flag pole + flag
  const pole = mesh(new THREE.CylinderGeometry(.03, .03, 6, 8), gold, 2.6, 3, -1.2, s);
  const flagGeo = new THREE.PlaneGeometry(2.4, 1.4, 24, 8);
  const fc = document.createElement('canvas'); fc.width = 300; fc.height = 175; const fg = fc.getContext('2d');
  ['#006847', '#f4f4f4', '#ce1126'].forEach((c, i) => { fg.fillStyle = c; fg.fillRect(i * 100, 0, 100, 175); });
  fg.fillStyle = '#7b4b1f'; fg.beginPath(); fg.arc(150, 88, 22, 0, 7); fg.fill();
  const ft = new THREE.CanvasTexture(fc); ft.colorSpace = THREE.SRGBColorSpace;
  const flag = mesh(flagGeo, std(0xffffff, { map: ft, side: THREE.DoubleSide, roughness: .8 }), 3.82, 5.2, -1.2, s);
  const fpos = flagGeo.attributes.position.array.slice();
  // character
  const man = stickman('suitBlack'); s.add(man.root); man.root.position.set(0, 0, 0);
  man.lArm.a.rotation.set(0, 0, -.12); man.rArm.a.rotation.set(0, 0, .12); man.lArm.b.rotation.x = -.15;
  // lights
  const key = dirLight(s, 0xffc070, 2.2, [3, 6, 6], [0, 1, 0], 4);
  const rim = new THREE.SpotLight(0xffd27a, 60, 20, .5, .6); rim.position.set(0, 4, -2); rim.target = man.head; s.add(rim);
  const fill = new THREE.PointLight(0x6080ff, 6, 10); fill.position.set(-3, 2, 3); s.add(fill);
  const lamps = [-3.2, 3.2].map(x => { const l = new THREE.PointLight(0xffb040, 8, 8); l.position.set(x, 2.3, -.4); s.add(l);
    mesh(new THREE.SphereGeometry(.12, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffdc90 }), x, 2.3, -.4, s); return l; });
  const dust = particles(260, 7, 0xffc860, .07, [10, 7, 6]); dust.position.set(0, 0, 1); s.add(dust);
  return { s, cam, update(t) {
    const k = easeOut(t / 1.8);
    cam.position.set(lerp(-.6, .25, k) + Math.sin(t * .4) * .05, lerp(6, 2.45, k), lerp(26, 6.0, k) - Math.max(0, t - 1.8) * .12);
    cam.lookAt(0, lerp(3, 1.5, k), 0);
    const p = flagGeo.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = fpos[i * 3], u = (x + 1.2) / 2.4; p.setZ(i, Math.sin(x * 3 - t * 5) * .15 * u); p.setY(i, fpos[i * 3 + 1] - u * u * .1); }
    p.needsUpdate = true; flagGeo.computeVertexNormals();
    man.head.rotation.y = Math.sin(t * .6) * .08; man.root.rotation.y = Math.sin(t * .3) * .05;
    lamps.forEach((l, i) => l.intensity = 8 + Math.sin(t * 9 + i * 2) * .8);
    moveParticles(dust, t, .12);
  } };
})());

// 2) Government office: stamping glowing documents
SC.push((() => {
  const { s, cam } = base(0x0b0907, 8, 30);
  s.add(new THREE.HemisphereLight(0x8a7a66, 0x1a120a, .7));
  const wood = std(0x4a200f, { roughness: .28, envMapIntensity: .8 });
  mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), std(0x2a1d14, { roughness: .9 }), 0, 0, 0, s);
  mesh(new THREE.BoxGeometry(14, 7, .3), std(0x3b2a1c, { roughness: .7 }), 0, 3.5, -3, s); // back wall panelling
  for (let i = -3; i <= 3; i++) mesh(new THREE.BoxGeometry(.12, 7, .2), std(0x2a1c10, { roughness: .6 }), i * 1.6, 3.5, -2.82, s);
  // flags
  [-1.4, 1.4].forEach(x => { mesh(new THREE.CylinderGeometry(.025, .025, 3, 8), std(0xc9962e, { metalness: 1, roughness: .3 }), x, 1.5, -2.4, s);
    ['#006847', '#f4f4f4', '#ce1126'].forEach((c, i) => mesh(new THREE.BoxGeometry(.26, 1.4, .02), std(new THREE.Color(c), { roughness: .8 }), x + .2 + i * .26 - .26, 2.2, -2.4, s)); });
  mesh(new THREE.CircleGeometry(.55, 48), std(0xc9962e, { metalness: 1, roughness: .35 }), 0, 3.6, -2.68, s); // seal
  // desk
  mesh(new THREE.BoxGeometry(3.2, .1, 1.5), wood, 0, .82, .3, s);
  mesh(new THREE.BoxGeometry(3.1, .78, 1.3), std(0x3a170a, { roughness: .35 }), 0, .4, .35, s);
  mesh(new THREE.BoxGeometry(.5, .06, .35), std(0x111111, { roughness: .4 }), -1.1, .9, .5, s);   // folder
  // chair
  mesh(new THREE.BoxGeometry(.8, 1.3, .15), std(0x2a0d08, { roughness: .5 }), 0, 1.15, -.88, s);
  mesh(new THREE.BoxGeometry(.75, .12, .65), std(0x2a0d08, { roughness: .5 }), 0, .5, -.5, s);
  // seated character
  const man = stickman('suitGrey'); s.add(man.root); man.root.position.set(0, -.38, -.55);
  for (const L of [man.lLeg, man.rLeg]) { L.a.rotation.x = -Math.PI / 2; L.b.rotation.x = Math.PI / 2; }
  // stamp in right hand
  const stamp = new THREE.Group(); man.rArm.end.add(stamp); stamp.position.y = -.08;
  mesh(new THREE.CylinderGeometry(.03, .04, .12, 16), std(0x3a1a08, { roughness: .4 }), 0, 0, 0, stamp);
  mesh(new THREE.BoxGeometry(.12, .04, .09), std(0x111111), 0, -.08, 0, stamp);
  // hologram documents
  const docTex = (label, col) => { const c = document.createElement('canvas'); c.width = 512; c.height = 680; const g = c.getContext('2d');
    g.strokeStyle = '#7fe8ff'; g.lineWidth = 8; g.shadowColor = '#3cf'; g.shadowBlur = 20; g.strokeRect(12, 12, 488, 656);
    g.fillStyle = 'rgba(80,220,255,.7)'; for (let i = 0; i < 9; i++) g.fillRect(50, 70 + i * 40, 280 + (i * 53 % 120), 12);
    g.save(); g.translate(256, 520); g.rotate(-.18); g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.lineWidth = 10; g.strokeRect(-210, -60, 420, 120);
    g.font = '900 70px "Liberation Sans"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, 0, 4); g.restore();
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
  const docs = [['LEGALIZADO', '#ffcc33'], ['IMPUESTO', '#ff4d3a'], ['LEGALIZADO', '#ffcc33'], ['IMPUESTO', '#ff4d3a']].map(([l, c], i) => {
    const blank = docTex('', c), full = docTex(l, c);
    const m = holoPlane(blank, .55, .73, .9); m.userData = { blank, full }; s.add(m); return m; });
  const big = holoPlane(textTex(['LEGALIZADO', '/ IMPUESTO'], { w: 1024, h: 360, size: 130 }), 2.4, .85); big.position.set(0, 2.55, .2); s.add(big);
  dirLight(s, 0xffe2b8, 2.4, [2, 5, 4], [0, 1, 0], 4);
  const lamp = new THREE.PointLight(0x55d8ff, 5, 4); lamp.position.set(0, 1.5, .6); s.add(lamp);
  const glow = new THREE.PointLight(0xffaa33, 0, 3); glow.position.set(.35, 1, .5); s.add(glow);
  return { s, cam, update(t, dur) {
    const a = lerp(-.75, .75, easeInOut(t / dur));
    cam.position.set(Math.sin(a) * 3.1, 1.75 + Math.sin(t * .5) * .05, Math.cos(a) * 3.1 + .3); cam.lookAt(0, 1.25, .2);
    const period = 1.6, ph = (t % period) / period, n = Math.floor(t / period);
    const down = ph < .35 ? Math.sin(ph / .35 * Math.PI / 2) : ph < .45 ? 1 : 1 - (ph - .45) / .55;
    man.rArm.a.rotation.set(-.55 - (1 - down) * .5, 0, .1); man.rArm.b.rotation.x = -1.05 + down * .1;
    man.lArm.a.rotation.set(-.6, 0, -.1); man.lArm.b.rotation.x = -.9;
    man.root.rotation.x = .05 + down * .04; man.head.rotation.x = .15;
    glow.intensity = ph > .33 && ph < .6 ? 6 * (1 - (ph - .33) / .27) : 0;
    docs.forEach((d, i) => {
      const age = t - i * .5; const k = (age % 4) / 4;
      d.position.set(lerp(.35, (i % 2 ? 1 : -1) * (.6 + i * .12), easeOut(k * 1.4)), .95 + k * 1.3, .5 - k * .2);
